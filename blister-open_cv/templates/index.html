<!DOCTYPE html>

<html>

<head>

<title>Medicine Boundary Detector</title>

<link rel="stylesheet"
href="/static/style.css">

</head>

<body>

<div class="container">

<h1>Medicine Boundary Detector</h1>

<form
action="/upload"
method="POST"
enctype="multipart/form-data">

<input
type="file"
name="image"
accept="image/*"
required>

<button>
Upload
</button>

</form>

{% if result %}

<h2>Output</h2>

<img
src="/{{result}}">

{% endif %}

</div>

</body>

</html>
